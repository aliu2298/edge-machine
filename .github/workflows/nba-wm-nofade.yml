name: NBA win margin NO fade
on:
  schedule:
    # Hourly. Every settled game is read once, after the fact, from its candles and trades.
    - cron: '52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nba-wm-nofade
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_nba_wm_nofade.py && python3 test_nba_wm_page.py && python3 test_nba_wm_v3.py && python3 test_nba_wm_v4.py && python3 test_nba_wm_v4prod.py && python3 test_nba_wm_v5.py && python3 test_nba_winmargin.py
      - name: NO fade (paper; in-sample from 2026-10-20, fresh record from 2026-10-31)
        run: python3 nba_wm_nofade.py
      - name: Paper version 3 (the executor's decision snapshots as the entries, fills from prints; from the first night a snapshot exists)
        run: python3 nba_wm_v3.py
      - name: Production version 4 (the executor's decisions pinned to wm-*-v4 as the entries, fills from prints; from the night of 2026-11-08)
        run: python3 nba_wm_v4prod.py
      - name: Sandbox paper (the version 4 rule since 2026-11-06, and the version 3 YES rule since 2026-11-08 as the comparison; the tracker's rows)
        run: python3 nba_wm_v4.py
      - name: Sandbox paper version 5 (candidates for the next version, pre-registered docs/prereg_nba_wm_v5_2026-11-11.md; Production still runs v4)
        run: python3 nba_wm_v5.py
      - name: Production feeds for the follower (a live Kalshi read, not the ledgers)
        run: python3 nba_wm_production.py
      - name: Save records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "NBA win margin NO fade observations" \
            --add data/nba_wm_nofade.json \
            --add data/nba_wm_v3.json \
            --add data/nba_wm_v4.json \
            --add data/nba_wm_v3paper.json \
            --add data/nba_wm_v4prod.json \
            --add data/nba_wm_v5.json \
            --derived data/production_nba_wm_leads.json "python3 nba_wm_production.py" \
            --derived data/production_nba_wm_nofade_leads.json "python3 nba_wm_production.py" \
            --after "gh workflow run sandbox-tracker.yml --ref main"
