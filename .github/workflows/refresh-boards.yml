name: Refresh boards

# Runs on GitHub's servers, so there is no dependency on the local Mac being awake.
# Since 2026-09-19: Sandbox closing prices + the site root, then publishes to GitHub Pages.

on:
  schedule:
    # Every 6h, not daily. A daily refresh made staleness UNDETECTABLE: normal
    # operation left the board up to 24h old, so a skipped cron looked identical to a
    # healthy one and no threshold could tell them apart. GitHub skipped the 2026-08-30
    # 11:17 slot and the board sat 18h stale with every check reporting green.
    # Six-hourly bounds staleness, makes one skipped run nearly invisible, and lets the
    # watchdog use a threshold tight enough to actually fire. Runs are ~45s and Actions
    # minutes are free on public repos, so the extra cost is nil.
    #
    # Every 3h since 2026-09-13: GitHub started the 6-hourly slots up to seven hours apart
    # (04:54, 11:58, 16:24), which left the board up to 8h stale and slowed every
    # withdrawal reaching it. More slots make a late or dropped one matter less.
    - cron: "41 */3 * * *"     # 00:41, 03:41, ... UTC
  workflow_dispatch:            # manual "Refresh now" from the Actions tab

# contents: push the regenerated board back to main.
# pages/id-token: publish to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Queue, never cancel. GitHub's own Pages guidance is explicit that an in-progress
# production deployment must be allowed to finish, so `cancel-in-progress: true` is the
# wrong lever here even though it would have masked the 2026-09-06 double-dispatch — it
# would have killed a run that was already deploying. The race is handled where it
# actually happens instead: the publish step below re-derives on top of whatever won.
concurrency:
  group: refresh-boards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # stdlib only — no pip install step needed

      # Stripped to what the Sandbox and Production still need (2026-09-19). The streaks,
      # book, on-fire and Record lanes are hidden and no longer rebuilt; their ledgers stay
      # in the repo as they are. data/streak_leads.json is frozen: it is read only to grade
      # Leads-lane entries from before 2026-09-18, which resolve on the exchange's own
      # settlement regardless.

      # Sandbox closing prices, taken on every refresh as well as by the close job and the
      # hourly watchdog. Writes only data/sandbox_closes/boards.json.
      - name: Snapshot Sandbox closing prices
        run: python3 sandbox_close.py --writer boards || echo "close snapshot failed — continuing"

      # The site root: forwards to the Sandbox and carries the "updated ... UTC" stamp the
      # backup watchdog reads to know this job deployed.
      - name: Write the site root
        run: python3 site_root.py

      - name: Commit and push if changed
        run: |
          git config user.name  "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"

          PUBLISHED="public_site/index.html data/sandbox_closes/boards.json"

          for attempt in 1 2 3; do
            git add $PUBLISHED
            if git diff --cached --quiet; then
              echo "no changes — nothing to deploy"
              exit 0
            fi
            git commit -m "Refresh board ($(date -u +%Y-%m-%d\ %H:%MZ))"
            if git push origin main; then
              echo "published on attempt $attempt"
              exit 0
            fi

            # Another run published while this one was building. The old handling was
            # `git pull --rebase`, which tries to MERGE generated files line by line and
            # conflicts on all eight every time — that is how the 2026-09-06 14:50 pair
            # of dispatches failed: the second run checked out 20s before the first
            # pushed, so it was stale from birth and could never rebase cleanly.
            #
            # Every file here is DERIVED. The four pages are a pure function of the
            # ledgers, and the ledgers are accumulative and idempotent — record() adds
            # only leads it has not seen, grade() settles by fixture, draw() fills empty
            # slots. So the correct resolution is never a line-by-line merge: take what
            # was published and RE-DERIVE on top of it.
            echo "push rejected — rebuilding on top of the newer board (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main      # keeps the ignored fixture cache, so no refetch
            python3 site_root.py && { python3 sandbox_close.py --writer boards || true; }
          done

          echo "::error::could not publish after 3 attempts — another run keeps winning the race"
          exit 1

      # GitHub Pages is the ONLY host (Netlify dropped Aug 3 2026 — it was skipping
      # every deploy for exceeded credit usage, and nothing here needed a feature
      # Pages lacks). Runs unconditionally so the board publishes even when nothing changed.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public_site
      - id: deployment
        uses: actions/deploy-pages@v5
