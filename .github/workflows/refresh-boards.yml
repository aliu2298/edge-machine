name: Refresh boards

# Runs on GitHub's servers, so there is no dependency on the local Mac being awake.
# Checks -> rebuilds the board -> publishes to GitHub Pages.

on:
  schedule:
    - cron: "17 11 * * *"      # daily ~11:17 UTC (off the hour)
  workflow_dispatch:            # manual "Refresh now" from the Actions tab

# contents: push the regenerated board back to main.
# pages/id-token: publish to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:                    # never let two refreshes race on the same branch
  group: refresh-boards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # stdlib only — no pip install step needed

      # Correctness gate. Runs BEFORE any build so a regression in run detection,
      # selection or grading fails loudly here rather than silently shipping a wrong
      # board. Strict on purpose — unlike health.py these assert behaviour, not freshness.
      - name: Logic tests
        run: |
          python3 test_streaks.py
          python3 test_slate.py

      # Guardrails. The failure mode here is SILENT — a live pick that never matches a
      # final score just sits on the board looking normal. Warn-only: a stale board beats
      # a blocked deploy, so this annotates the run summary instead of failing it.
      - name: Health check
        run: python3 health.py

      # Streak leads off ESPN's keyless scoreboard. API-Football is NOT usable here —
      # its free plan blocks the current season outright ("try from 2022 to 2024"), and a
      # streak is a claim about current form. --force skips the 6h local cache so CI
      # always pulls fresh. This step also logs newly published leads to
      # data/streak_leads.json and grades any whose fixture has now been played, so the
      # ledger accumulates on its own. Never fails the run: a stale board beats a red
      # deploy — but note a failure also means no grading happened this cycle.
      - name: Rebuild streaks board and grade leads
        run: python3 streaks_build.py --force || echo "streaks build failed — keeping previous board"

      # MUST run after streaks_build: the slate draws from the leads it just published.
      # Also grades any live pick whose fixture has finished, then refills the slot.
      - name: Draw and grade the slate
        run: python3 slate_build.py || echo "slate build failed — keeping previous board"

      - name: Commit and push if changed
        run: |
          git config user.name  "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add public_site/index.html public_site/streaks.html \
                  data/streaks.json data/streak_leads.json data/slate.json
          if git diff --cached --quiet; then
            echo "no changes — nothing to deploy"
            exit 0
          fi
          git commit -m "Refresh board ($(date -u +%Y-%m-%d))"
          # rebase in case the board was pushed from the Mac meanwhile
          git pull --rebase --autostash origin main
          git push origin main

      # GitHub Pages is the ONLY host (Netlify dropped Aug 3 2026 — it was skipping
      # every deploy for exceeded credit usage, and nothing here needed a feature
      # Pages lacks). Runs unconditionally so the board publishes even when nothing changed.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site
      - id: deployment
        uses: actions/deploy-pages@v4
