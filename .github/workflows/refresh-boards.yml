name: Refresh boards

# Runs on GitHub's servers, so there is no dependency on the local Mac being awake.
# Checks -> rebuilds the board -> publishes to GitHub Pages.

on:
  schedule:
    - cron: "17 11 * * *"      # daily ~11:17 UTC (off the hour)
  workflow_dispatch:            # manual "Refresh now" from the Actions tab

# contents: push the regenerated board back to main.
# pages/id-token: publish to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:                    # never let two refreshes race on the same branch
  group: refresh-boards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # stdlib only — no pip install step needed

      # Guardrails. The failure mode here is SILENT — a pick with a wrong kickoff date
      # keeps rendering as "upcoming" with nothing reporting a problem. Warn-only on
      # purpose: a stale board is worse than a flagged one, so this annotates the run
      # summary without blocking the deploy.
      - name: Health check
        run: python3 health.py

      # predictions.db stays local+gitignored (it also holds private kalshi_* tables);
      # data/predictions.json is the repo-tracked mirror of the predictions table only,
      # so the board can be rebuilt here without the Mac.
      - name: Rebuild sports board
        run: python3 export_public.py

      - name: Commit and push if changed
        run: |
          git config user.name  "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add public_site/index.html public_site/picks.json data/predictions.json
          if git diff --cached --quiet; then
            echo "no changes — nothing to deploy"
            exit 0
          fi
          git commit -m "Refresh board ($(date -u +%Y-%m-%d))"
          # rebase in case the board was pushed from the Mac meanwhile
          git pull --rebase --autostash origin main
          git push origin main

      # GitHub Pages is the ONLY host (Netlify dropped Aug 3 2026 — it was skipping
      # every deploy for exceeded credit usage, and nothing here needed a feature
      # Pages lacks). Runs unconditionally so the board publishes even when nothing changed.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site
      - id: deployment
        uses: actions/deploy-pages@v4
