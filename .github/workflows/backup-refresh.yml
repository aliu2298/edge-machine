name: Backup refresh (watchdog)

# Failover for "Refresh boards". Deliberately NOT a duplicate of it.
#
# A second copy of the pipeline on its own schedule would double the work and, worse, race
# the primary on push. This instead runs 3h after each primary slot, asks whether the
# primary actually did its job, and only takes over when it did not.
#
# Three independent things are checked, because they fail in different ways:
#   1. Did the primary workflow SUCCEED recently?   (it never ran, or it ran red)
#   2. Did the tracker workflow SUCCEED recently?   (it rebuilds the two pages;
#      takeover only rewrites index.html and cannot rebuild them)
#   3. Are the LIVE Sandbox and Production pages fresh?
#      (a workflow ran green but those pages are stale — the Pages deploy has
#      flaked before on an OIDC token timeout). The site root is not this check:
#      site_root.py rewrites that redirect stub every refresh, so it stays new
#      even when the tracker is dead.
# Any of these is enough to take over. Takeover still cannot rebuild the two
# pages, so after that deploy — and when takeover does not run — the pages are
# checked again. If either is still stale or missing, the job fails. A dead
# tracker must not stay green.
#
# Two jobs (2026-09-13). GitHub started the 6-hourly primary as much as seven hours apart,
# and a watchdog that only acted at 8 hours left the published leads that stale before it
# did anything. It now checks HOURLY and takes over
# at 5 hours. `watch` is cheap and runs outside the boards' concurrency group: a group holds
# one pending run and a newer one replaces it, so an hourly job inside the group could
# silently cancel a queued primary or tracker run. Only `takeover` joins the group, and only
# when it actually runs. `watch` also snapshots Sandbox closing prices every hour.

on:
  schedule:
    # Hourly, off the top of the hour. Most runs only look and exit.
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run the pipeline even if the primary looks healthy"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read                # to read the primary workflow's run history

env:
  # The primary runs every 3h, so a healthy board is under ~3h old (plus GitHub's start
  # delay). 5h fires on one missed or badly late slot.
  STALE_AFTER_HOURS: 5
  BOARD_URL: https://aliu2298.github.io/edge-machine/

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.check.outputs.run }}

    steps:
      - uses: actions/checkout@v7

      - name: Decide whether to take over
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_TAKEOVER: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          REASONS=""

          # --- 1. when did the primary last SUCCEED? ---
          LAST=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/refresh-boards.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty' || true)
          if [ -z "$LAST" ]; then
            REASONS="primary has no successful run on record"
          else
            AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 3600 ))
            echo "primary last succeeded ${AGE}h ago ($LAST)"
            if [ "$AGE" -gt "${STALE_AFTER_HOURS}" ]; then
              REASONS="primary last succeeded ${AGE}h ago"
            fi
          fi

          # --- 1b. when did the tracker last SUCCEED? ---
          # Same window as the primary: the tracker runs every 3h, so 5h is one
          # missed slot. This only adds a takeover reason. Failing the watch job
          # here would skip takeover, and the loud failure belongs after deploy.
          TLAST=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/sandbox-tracker.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty' || true)
          if [ -z "$TLAST" ]; then
            REASONS="${REASONS:+$REASONS; }tracker has no successful run on record"
          else
            TAGE=$(( ( $(date -u +%s) - $(date -u -d "$TLAST" +%s) ) / 3600 ))
            echo "tracker last succeeded ${TAGE}h ago ($TLAST)"
            if [ "$TAGE" -gt "${STALE_AFTER_HOURS}" ]; then
              REASONS="${REASONS:+$REASONS; }tracker last succeeded ${TAGE}h ago"
            fi
          fi

          # --- 2. are sandbox.html and production.html actually fresh? ---
          # The site root is a redirect stub rewritten every refresh, so its stamp
          # stays new when the tracker is dead. These two pages carry the tracker's
          # own "updated YYYY-MM-DD HH:MM UTC" stamp. A missing or unparseable stamp
          # is stale. page_freshness.py is what the unit tests exercise.
          # Stale pages are a takeover reason, not a failure of this step. Takeover
          # cannot rebuild them; the recheck after deploy (and the no-takeover step
          # below) exits 1 if they are still stale. Exiting here would skip that.
          if ! PAGE_REASONS=$(python3 - << 'PY'
          import os, sys
          from page_freshness import PAGES, fetch_pages

          if tuple(PAGES) != ("sandbox.html", "production.html"):
              sys.exit("page_freshness.PAGES must be sandbox.html and production.html")
          hours = float(os.environ["STALE_AFTER_HOURS"])
          results = fetch_pages(os.environ["BOARD_URL"], stale_hours=hours)
          for ok, msg in results:
              print(msg, file=sys.stderr)
          sys.stdout.write("; ".join(msg for ok, msg in results if not ok))
          PY
          ); then
            echo "::error::could not check sandbox.html and production.html"
            exit 1
          fi
          if [ -n "$PAGE_REASONS" ]; then
            REASONS="${REASONS:+$REASONS; }$PAGE_REASONS"
          fi

          if [ "$FORCE_TAKEOVER" = "true" ]; then
            REASONS="${REASONS:-forced by manual dispatch}"
          fi

          if [ -n "$REASONS" ]; then
            echo "::warning::Backup taking over — $REASONS"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Primary is healthy; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Every hour, whatever the board's state. Writes only data/sandbox_closes/watchdog.json,
      # which nothing else commits, so the rebase below cannot conflict.
      - name: Snapshot Sandbox closing prices
        run: |
          python3 sandbox_close.py --writer watchdog || { echo "::warning::close snapshot failed"; exit 0; }
          git config user.name  "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add data/sandbox_closes/watchdog.json
          git diff --cached --quiet && exit 0
          git commit -m "Sandbox closing prices via watchdog ($(date -u +%Y-%m-%d\ %H:%MZ))"
          for attempt in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          echo "::warning::could not push closing prices"

      # Takeover did not run. The check above only warns, and a dead tracker would
      # otherwise leave this hourly job green. Re-read the live pages and fail if
      # either is still stale or missing.
      - name: Fail if the tracker pages are stale and takeover will not run
        if: steps.check.outputs.run != 'true'
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import page_freshness
          import sys
          sys.exit(page_freshness.recheck_main())
          PY

  takeover:
    needs: watch
    if: needs.watch.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: refresh-boards    # MUST match the primary, or the two can push together
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # From here the steps mirror the primary (stripped 2026-09-19 to the site root).
      - name: Write the site root
        run: python3 site_root.py

      - name: Commit and push if changed
        run: |
          git config user.name  "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"

          PUBLISHED="public_site/index.html"

          for attempt in 1 2 3; do
            git add $PUBLISHED
            if git diff --cached --quiet; then
              echo "no changes — nothing to deploy"
              exit 0
            fi
            git commit -m "Refresh board via backup ($(date -u +%Y-%m-%d\ %H:%MZ))"
            if git push origin main; then
              echo "published on attempt $attempt"
              exit 0
            fi

            # Another run published while this one was building. The old handling was
            # `git pull --rebase`, which tries to MERGE generated files line by line and
            # conflicts on all eight every time — that is how the 2026-09-06 14:50 pair
            # of dispatches failed: the second run checked out 20s before the first
            # pushed, so it was stale from birth and could never rebase cleanly.
            #
            # Every file here is DERIVED. The four pages are a pure function of the
            # ledgers, and the ledgers are accumulative and idempotent — record() adds
            # only leads it has not seen, grade() settles by fixture, draw() fills empty
            # slots. So the correct resolution is never a line-by-line merge: take what
            # was published and RE-DERIVE on top of it.
            echo "push rejected — rebuilding on top of the newer board (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main      # keeps the ignored fixture cache, so no refetch
            python3 site_root.py
          done

          echo "::error::could not publish after 3 attempts — another run keeps winning the race"
          exit 1

      # Deploy runs whenever the backup took over, even if nothing changed — a stale LIVE
      # board with an unchanged repo is exactly the failure this workflow exists to fix.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public_site
      - id: deployment
        uses: actions/deploy-pages@v5

      # index.html is redeployed above. That does not rebuild sandbox.html or
      # production.html, so a tracker that is still dead must fail this job.
      - name: Fail if the tracker pages are still stale
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import page_freshness
          import sys
          sys.exit(page_freshness.recheck_main())
          PY
