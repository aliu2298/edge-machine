name: NBA Safe Card paper research
on:
  schedule:
    # Hourly fallback: settle the legs and the card, and rewrite the tip schedule the VPS reads.
    # The card itself needs a read 90-60 minutes before the slate's first tip, which GitHub's cron
    # cannot hold, so the VPS asks (scripts/vps_window_requests.sh, lane_windows.nba_safe_windows).
    - cron: '47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/nba_safe_card_window/**"
permissions:
  contents: write
concurrency:
  group: nba-safe-card
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_nba_safe_card.py
      - name: Build tonight's card when due, log tip prices, settle (own ledger)
        run: python3 nba_safe_card.py
      - name: Save records
        run: |
          set -euo pipefail
          python3 -c 'import json; json.load(open("data/nba_safe_card.json"))'
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add data/nba_safe_card.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NBA Safe Card paper observations"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
