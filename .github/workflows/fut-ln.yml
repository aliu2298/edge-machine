name: Soccer futures longshot NO
# fut_ln.py (2026-11-14, docs PR 460): on the 1st of each month (Sep-Apr) the league-winner markets with a 3-15c YES bid are paper-bought NO, one entry per
# market per season, held to settlement. Paper only: nothing live. Idempotent (a checkpoint month is entered once; the second cron is a retry), so a missed
# run inside the 3-day grace window costs nothing. First checkpoint 2026-12-01.
on:
  schedule:
    - cron: '23 5 * * *'
    - cron: '47 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: fut-ln
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_fut_ln.py
      - name: Run
        run: python3 fut_ln.py
      - name: Save records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "Soccer futures longshot NO" \
            --add data/fut_ln_ledger.json \
            --regenerate "python3 fut_ln.py" \
            --after "gh workflow run sandbox-tracker.yml --ref main"
