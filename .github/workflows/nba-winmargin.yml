name: NBA win margin tracker
on:
  schedule:
    # Hourly. Every settled game is read once, after the fact, from its candles and trades.
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nba-winmargin
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_nba_winmargin.py
      - name: Win margin tracker (observation only, paper; backfills from 2026-10-20)
        run: python3 nba_winmargin.py
      - name: Save records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "NBA win margin tracker observations" \
            --add data/nba_winmargin_tracker.json \
            --after "gh workflow run sandbox-tracker.yml --ref main"
