name: ATP total games paper research (retired, settles open entries)
on:
  schedule:
    # RETIRED 2026-10-29 (Olu): no new entries and no window reads (lane_windows stops asking). The hourly
    # run only settles the entries still open; with none open it does nothing. Delete this workflow once
    # the ledger shows no open entry.
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tennis-totals
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_tennis_totals.py
      - name: Enter due matches and settle (tennis_atp_low_over, own ledger)
        run: python3 tennis_totals.py
      - name: Save records
        run: |
          set -euo pipefail
          python3 -c 'import json; json.load(open("data/tennis_totals_ledger.json"))'
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add data/tennis_totals_ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ATP total games paper observations"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
