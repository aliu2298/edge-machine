name: ATP total games paper research
on:
  schedule:
    # Hourly, to settle entries and refresh the start schedule. Entries need a read 45-15 minutes
    # before each ATP start, which GitHub's cron cannot hold, so the VPS asks for those (below).
    - cron: '23 * * * *'
  workflow_dispatch:
  # The VPS asks for each read by pushing a stamp (scripts/vps_window_requests.sh,
  # lane_windows.tennis_windows): one window per ESPN start, 45 to 15 minutes before.
  push:
    branches: [main]
    paths:
      - "data/tennis_totals_window/**"
permissions:
  contents: write
concurrency:
  group: tennis-totals
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_tennis_totals.py
      - name: Enter due matches and settle (tennis_atp_low_over, own ledger)
        run: python3 tennis_totals.py
      - name: Save records
        run: |
          set -euo pipefail
          python3 -c 'import json; json.load(open("data/tennis_totals_ledger.json"))'
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add data/tennis_totals_ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ATP total games paper observations"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
