name: Sandbox Audit

# An independent check that the Sandbox record is right. The tracker writes the ledger; this
# reads it back, recomputes every figure it can from the raw bets, and asks the venues again
# for a sample of results. See sandbox_audit.py for the full list.
#
# It is deliberately separate from the tracker: a check that runs inside the thing it checks
# shares its blind spots. It must not write the ledger. The one file it commits is
# data/settlement_mismatches.json — market ids whose stored result disagreed with the
# venue — so the next run still fails on them when the random sample misses the row.
# A failed run means the record is wrong or the grader has stopped; GitHub emails the
# repository owner on a failed scheduled run, so a fault does not sit unnoticed.

on:
  schedule:
    # Every 6h at :45 on 03, 09, 15, 21 UTC — an hour and a half after the tracker's 02:11,
    # 08:11, 14:11 and 20:11 runs have committed, and well before the next one starts, so it
    # always reads a settled snapshot rather than one being written.
    - cron: "45 3-23/6 * * *"
  workflow_dispatch:

permissions:
  contents: write    # commit data/settlement_mismatches.json only; the ledger stays untouched
  issues: write      # the milestone step raises an issue

concurrency:
  group: sandbox-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # First prove the auditor still catches what it claims to: every check is fed a record
      # with a planted fault and must fire. An audit that could no longer fail would pass
      # everything, which is worse than having none.
      - name: The audit catches planted faults
        run: python3 test_audit.py

      # Then audit the record itself, asking the venues again. Stdlib only.
      # A failure here still continues to the next step: the watch list has to be committed
      # on the run that found the mismatch, or the following run never hears about it.
      - name: Audit the Sandbox record
        id: audit
        run: python3 sandbox_audit.py --sample 25

      # The ledger is not staged. Anything else staged is refused rather than published.
      - name: Remember settlement mismatches
        if: always()
        run: |
          if [ ! -f data/settlement_mismatches.json ]; then
            echo "no watch list to commit"
            exit 0
          fi
          git config user.name  "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add -- data/settlement_mismatches.json
          staged=$(git diff --cached --name-only)
          if [ -z "$staged" ]; then
            echo "no watch-list change"
            exit 0
          fi
          if [ "$staged" != "data/settlement_mismatches.json" ]; then
            echo "::error::refusing to commit anything but the settlement watch list"
            echo "$staged"
            exit 1
          fi
          git commit -m "Sandbox audit: remember settlement mismatches ($(date -u +%Y-%m-%d\ %H:%MZ))"
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "watch list published on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebasing onto the newer main (attempt $attempt)"
            git pull --rebase origin main
          done
          echo "::error::could not push the settlement watch list after 3 attempts"
          exit 1

      # Milestones: when a record reaches a size worth deciding on, raise an issue that
      # mentions the owner, which GitHub emails. Each fires once. Runs whatever the audit
      # found, since it answers a different question.
      - name: Milestones
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 sandbox_milestones.py
