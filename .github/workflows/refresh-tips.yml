name: Refresh tips

# Replaces the Lovable app's scheduled edge function. Runs on GitHub's servers, so
# there is no CORS restriction and no dependency on the local Mac being awake.
# Scrapes -> settles -> rebuilds all three boards -> publishes to GitHub Pages.

on:
  schedule:
    - cron: "17 11 * * *"      # daily ~11:17 UTC (off the hour — see note below)
  workflow_dispatch:            # manual "Refresh now" from the Actions tab

# contents: push the regenerated boards back to main.
# pages/id-token: publish those boards to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:                    # never let two refreshes race on the same branch
  group: refresh-tips
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # stdlib only — no pip install step needed

      - name: Scrape published predictions
        run: python3 sg_scrape.py

      - name: Settle finished matches
        run: python3 sg_settle.py

      # Guardrails. The failure mode here is SILENT — a fixture whose teams don't match
      # ESPN never settles and just keeps rendering as "upcoming" (Vancouver v LAFC sat
      # like that for two days). Warn-only on purpose: a stale board is worse than a
      # flagged one, so this annotates the run summary without blocking the deploy.
      - name: Health check
        run: python3 sg_health.py

      # Tracks Kalshi's KXEARNINGSMENTION series (159 companies, category "Mentions").
      # An earlier note here claimed these did not exist — that was wrong: the scan had
      # hardcoded 10 of Kalshi's 18 categories and never looked at "Mentions".
      # Refreshes live in-band strikes for the earnings board. Never fails the run.
      - name: Watch for new Kalshi market types
        run: python3 kalshi_watch.py

      # Grade earnings-call mention picks off Kalshi's own resolution and report
      # calibration. Base rate on these is high by construction, so win rate proves
      # little — the Brier-vs-base-rate line is the number that says whether the
      # phrase judgement is real. Never fails the run.
      - name: Score mention picks
        run: python3 mention_settle.py

      # Metric quarterlies live in predictions.db, which is gitignored and local-only, so
      # this no-ops in CI with a clear message. Kept in the workflow so the step is visible
      # rather than forgotten — see the note in kalshi_settle.py about the local-only gap.
      - name: Score quarterly picks
        run: python3 kalshi_settle.py

      - name: Rebuild tips board
        run: python3 sg_build.py

      # predictions.db stays local+gitignored (it also holds private kalshi_* tables);
      # data/predictions.json is the repo-tracked mirror of the predictions table only,
      # so the sports + earnings boards can be rebuilt here without the Mac.
      - name: Rebuild sports + earnings boards
        run: python3 export_public.py

      - name: Commit and push if changed
        run: |
          git config user.name  "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add data/sg_picks.json public_site/tips.html \
                  public_site/index.html public_site/earnings.html public_site/picks.json
          if git diff --cached --quiet; then
            echo "no changes — nothing to deploy"
            exit 0
          fi
          git commit -m "Refresh tips board ($(date -u +%Y-%m-%d))"
          # rebase in case the board was pushed from the Mac meanwhile
          git pull --rebase --autostash origin main
          git push origin main

      # GitHub Pages is the ONLY host (Netlify dropped Aug 3 2026 — it was skipping
      # every deploy for exceeded credit usage, and nothing here needed a feature
      # Pages lacks). Free and unmetered for public repos, no build credits.
      # Runs unconditionally so the boards publish even when nothing changed.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site
      - id: deployment
        uses: actions/deploy-pages@v4
