name: Refresh tips

# Replaces the Lovable app's scheduled edge function. Runs on GitHub's servers, so
# there is no CORS restriction and no dependency on the local Mac being awake.
# Pushing to main triggers Netlify's git-linked auto-deploy.

on:
  schedule:
    - cron: "17 11 * * *"      # daily ~11:17 UTC (off the hour — see note below)
  workflow_dispatch:            # manual "Refresh now" from the Actions tab

# contents: push the regenerated boards back to main.
# pages/id-token: publish those boards to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:                    # never let two refreshes race on the same branch
  group: refresh-tips
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # stdlib only — no pip install step needed

      - name: Scrape published predictions
        run: python3 sg_scrape.py

      - name: Settle finished matches
        run: python3 sg_settle.py

      - name: Rebuild tips board
        run: python3 sg_build.py

      # predictions.db stays local+gitignored (it also holds private kalshi_* tables);
      # data/predictions.json is the repo-tracked mirror of the predictions table only,
      # so the sports + earnings boards can be rebuilt here without the Mac.
      - name: Rebuild sports + earnings boards
        run: python3 export_public.py

      - name: Commit and push if changed
        run: |
          git config user.name  "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add data/sg_picks.json public_site/tips.html \
                  public_site/index.html public_site/earnings.html public_site/picks.json
          if git diff --cached --quiet; then
            echo "no changes — nothing to deploy"
            exit 0
          fi
          git commit -m "Refresh tips board ($(date -u +%Y-%m-%d))"
          # rebase in case the board was pushed from the Mac meanwhile
          git pull --rebase --autostash origin main
          git push origin main
          echo "pushed=yes" >> "$GITHUB_ENV"

      # A push made with the default GITHUB_TOKEN does NOT emit a webhook — GitHub
      # suppresses it to avoid CI loops — so Netlify's git integration never hears
      # about these commits and the site silently goes stale. Poke it directly.
      # Create the hook at: Netlify -> Site configuration -> Build & deploy ->
      # Build hooks, then save the URL as repo secret NETLIFY_BUILD_HOOK.
      - name: Trigger Netlify deploy
        if: env.pushed == 'yes'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::NETLIFY_BUILD_HOOK not set — the site will NOT update."
            echo "::warning::Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$HOOK" && echo "Netlify build triggered"

      # GitHub Pages: free and unmetered for public repos, with no build credits to
      # exhaust. Added Aug 3 2026 after Netlify began skipping every deploy with
      # "account credit usage exceeded", freezing the live site. Runs unconditionally
      # so the boards publish even when nothing changed and even if Netlify is down.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site
      - id: deployment
        uses: actions/deploy-pages@v4
