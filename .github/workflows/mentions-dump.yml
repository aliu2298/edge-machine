name: Mentions dump bid
# mentions_dump.py (2026-11-14, docs PR 464): sweeps Kalshi's Mentions series for markets settled since the last sweep, then replays each event once, after every
# word has settled, from public trade prints under the fixed rule of docs/prereg_mentions_dump_2026-11-14.md. A Sandbox PAPER watch. No orders, no VPS, no live loop.
# The replay is after the fact, so a late or missed run only delays rows: the next run sweeps from a safe margin and reads every event not yet in the ledger.
# Request load: one series list, one listing for each of ~465 series (about two minutes at the shared throttle), then a few pulls an event. Every four hours
# at minute 11, off the minutes the other watches use.
on:
  schedule:
    - cron: '11 1,5,9,13,17,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: mentions-dump
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_mentions_dump.py
      - name: Replay the settled events
        run: python3 mentions_dump.py
      - name: Save records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "Mentions dump bid paper watch" \
            --add data/mentions_dump_ledger.json \
            --regenerate "python3 mentions_dump.py" \
            --after "gh workflow run sandbox-tracker.yml --ref main"
