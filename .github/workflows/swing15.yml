name: 15-Minute Swing paper tracker
# swing15.py (2026-11-08, sw15-v1): grades every settled Kalshi 15-minute window in Crypto, Commodities and Financials
# from Kalshi's own candles and trade prints, once each, after it settles. Public data only; nothing is placed.
# Hourly: a window is graded on the first run after it settles; the lookback is 36 hours, so a missed run catches up.
# 2026-11-09: GitHub's cron never fired on the first night, so the VPS asks every hour by pushing a stamp
# (scripts/vps_window_requests.sh, lane_windows.py); the cron stays as a backup.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/swing15_window/**"
permissions:
  contents: write
concurrency:
  group: swing15
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_swing15.py && python3 test_swing15v2.py
      - name: Grade settled windows
        id: grade
        run: python3 swing15.py --budget 900
      - name: v2 record (sw15-v2, a filter over the v1 rows)
        if: ${{ !cancelled() && (steps.grade.outcome == 'success' || steps.grade.outcome == 'failure') }}
        run: python3 swing15v2.py
      - name: Save the ledger
        if: ${{ !cancelled() && (steps.grade.outcome == 'success' || steps.grade.outcome == 'failure') }}
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          # The hour shards this run wrote or changed (data/swing15/<ET day>/<HH>.json).
          shards=$(git status --porcelain --untracked-files=all -- data/swing15 | awk '{print $NF}' | grep '\.json$' || true)
          python3 save_records.py --message "15-Minute Swing paper windows" \
            --add data/swing15_ledger.json \
            --optional data/swing15v2_ledger.json $shards
