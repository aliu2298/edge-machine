name: Soccer label rules paper research
on:
  workflow_dispatch:
  # The VPS asks for each read by pushing a stamp (scripts/vps_window_requests.sh,
  # lane_windows.py): one window per kickoff, 90 to 20 minutes before, read every 30 minutes.
  # GitHub's cron does not fire reliably in this repo, so there is no schedule.
  push:
    branches: [main]
    paths:
      - "data/soccer_rules_window/**"
      - "data/soccer_rules_settle_window/**"
permissions:
  contents: write
concurrency:
  group: soccer-rules
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Settle-only mode (2026-11-16)
        # The VPS asks once an hour while a started pick is still open, with a stamp of its own (lane_windows.settle_windows).
        # A run that ONLY that stamp started settles and adds no entries (settle_only.py); a manual run or an entry stamp does both.
        run: |
          changed="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
          if [ "${{ github.event_name }}" = "push" ] && printf '%s\n' "$changed" | grep -q '^data/soccer_rules_settle_window/' \
             && ! printf '%s\n' "$changed" | grep -q '^data/soccer_rules_window/'; then
            echo "EDGE_SETTLE_ONLY=1" >> "$GITHUB_ENV"
            echo "settle-only pass"
          fi
      - name: Tests
        env:
          EDGE_SETTLE_ONLY: ""     # the tests exercise entries: never in settle-only mode
        run: python3 test_soccer_rules.py && python3 test_contender_overs.py && python3 test_sa_o15.py && python3 test_btts_sa.py && python3 test_shadows.py && python3 test_save_records.py
      - name: Enter due matches and settle
        # Fetches the ESPN fixtures (data/streaks_raw.json, not committed) for the labels.
        run: python3 soccer_rules.py
      - name: Title contenders' overs (contender_overs.py, same window, own ledger)
        run: python3 contender_overs.py
      - name: Argentina & Brasileirão over 1.5 (sa_o15.py, same window, own ledger and kickoff schedule)
        run: python3 sa_o15.py
      - name: Brazil and Argentina BTTS YES (btts_sa.py, same window, own ledger and kickoff schedule; paper)
        run: python3 btts_sa.py
      - name: Flipped Unders (flipped_unders.py, same window, own ledger; paper)
        run: python3 flipped_unders.py
      - name: Soccer rules Production feed (A7, A6, D3, Argentina over 1.5; 2026-10-21)
        # Right after the reads above, so an entry 90-20 minutes before kickoff is published
        # while there is time to act on it (production.FIRST_PUBLISH_MIN).
        run: python3 soccer_rules_production.py
      - name: Shadows on A7, Argentina and Brasileirão (shadows.py soccer; paper; reads the ledgers above)
        run: python3 shadows.py soccer || echo "shadows failed; the lane and its Production feed are not held up"
      - name: Save records
        # The Feeds heartbeat restamps data/soccer_rules_production_leads.json too, so it can push between
        # this run's checkout and its push. save_records.py rebases the ledgers (only this workflow writes
        # them) and, on a rejected push, REBUILDS the feed from the merged ledgers instead of failing on it.
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "Soccer label rules paper observations" \
            --add data/soccer_rules_ledger.json data/contender_overs_ledger.json data/sa_o15_ledger.json data/btts_sa_ledger.json data/shadows_soccer_ledger.json \
            --derived data/soccer_rules_production_leads.json "python3 soccer_rules_production.py"
