name: Feeds heartbeat
on:
  schedule:
    # Twice an hour. GitHub's cron skips most runs in this repo (3 of ~17 hourly runs fired in one
    # 17h stretch on 2026-10-31), so the workflow_run triggers below are the real clock: the Sandbox
    # Tracker and the lane workflows run many times a day, and a run of any of them restamps the feeds.
    - cron: '7,37 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Sandbox Tracker"
      - "NBA value lanes and ladder tracker"
      - "Econ and Finance Daily paper research"
      - "Soccer label rules paper research"
      - "Soccer team scoring rules paper research"
      - "Culture lanes paper research"
      - "Over 3.5 cheap NO paper research"
      - "NBA win margin NO fade"
    types: [completed]
permissions:
  contents: write
concurrency:
  group: feeds-heartbeat
  cancel-in-progress: false
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_soccer_feed_heartbeat.py
      # Each producer rebuilds its feed at the real clock: a started lead is dropped, and open leads are
      # published only while the collector's last read is under 3h old, so nothing stale passes as fresh.
      # A feed restamped in the last 20 minutes is left alone, so a burst of triggers writes once.
      - name: Soccer rules feed
        run: python3 soccer_rules_production.py --heartbeat
      - name: Soccer team rules feed
        run: python3 soccer_team_rules_production.py --heartbeat
      - name: NBA value feed (empty since the lanes left Production 2026-10-28)
        run: python3 nba_value_production.py --heartbeat
      - name: Econ feed
        run: python3 daily_production.py --heartbeat
      - name: Over 3.5 cheap NO feed (live Kalshi read)
        run: python3 o35_production.py --heartbeat
      - name: Top-5 goalless dip feed (live Kalshi read)
        run: python3 top5_dip_production.py --heartbeat
      - name: NBA win margin feeds (live Kalshi read)
        run: python3 nba_wm_production.py --heartbeat
      - name: Production feed build gap (status only; the daily health check reads data/feed_gap.json)
        env:
          GH_AUTH: ${{ github.token }}
        run: python3 test_feed_gap.py && python3 feed_gap.py
      - name: Save the feeds
        env:
          GH_AUTH: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "Feeds heartbeat" \
            --derived data/soccer_rules_production_leads.json "python3 soccer_rules_production.py --heartbeat" \
            --derived data/soccer_team_rules_production_leads.json "python3 soccer_team_rules_production.py --heartbeat" \
            --derived data/nba_value_production_leads.json "python3 nba_value_production.py --heartbeat" \
            --derived data/econ_production_leads.json "python3 daily_production.py --heartbeat" \
            --derived data/production_o35_leads.json "python3 o35_production.py --heartbeat" \
            --derived data/production_top5_dip_leads.json "python3 top5_dip_production.py --heartbeat" \
            --derived data/production_nba_wm_leads.json "python3 nba_wm_production.py --heartbeat" \
            --derived data/production_nba_wm_nofade_leads.json "python3 nba_wm_production.py --heartbeat" \
            --derived data/feed_gap.json "python3 feed_gap.py"
