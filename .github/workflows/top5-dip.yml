name: Top-5 soccer goalless dip paper research
on:
  schedule:
    # Hourly. Every settled game is evaluated once, after the fact, from its trades, so no window stamp is
    # needed and a missed run only delays a row.
    - cron: '52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: top5-dip
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_top5_dip.py
      - name: Top-5 soccer goalless dip, over 1.5 (Sandbox paper since 2026-10-31, held trade-print fills)
        run: python3 top5_dip.py
      - name: Save records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "Top-5 soccer goalless dip paper observations" \
            --add data/top5_dip_ledger.json \
            --after "gh workflow run sandbox-tracker.yml --ref main"
