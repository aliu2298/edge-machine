name: Soccer feeds heartbeat
on:
  schedule:
    # Hourly. The soccer workflows run only in VPS-stamped windows around matches, so between windows
    # the two Production feeds' updated_at ages past the follower's 8h staleness guard. This restamps both with
    # the clock and rebuilds their leads at that clock: a lead whose kickoff has passed is dropped, and
    # open leads are published only while the collector's last read is under 3h old, so nothing stale is
    # ever presented as fresh. GitHub's cron skips some runs; one success in any 8h is enough.
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: soccer-feed-heartbeat
  cancel-in-progress: false
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_soccer_feed_heartbeat.py
      - name: Restamp the soccer rules feed
        run: python3 soccer_rules_production.py --heartbeat
      - name: Restamp the soccer team rules feed
        run: python3 soccer_team_rules_production.py --heartbeat
      - name: Save the feeds
        run: |
          set -euo pipefail
          python3 -c 'import json; json.load(open("data/soccer_rules_production_leads.json")); json.load(open("data/soccer_team_rules_production_leads.json"))'
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add data/soccer_rules_production_leads.json data/soccer_team_rules_production_leads.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Soccer feeds heartbeat"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            # A collector run that published in the meantime is newer than this restamp: take its feeds.
            git reset --hard origin/main
            python3 soccer_rules_production.py --heartbeat
            python3 soccer_team_rules_production.py --heartbeat
            git add data/soccer_rules_production_leads.json data/soccer_team_rules_production_leads.json
            git diff --cached --quiet && exit 0
            git commit -m "Soccer feeds heartbeat"
          done
          exit 1
