name: Soccer team scoring rules paper research
on:
  workflow_dispatch:
  # The VPS asks for each read by pushing a stamp (scripts/vps_window_requests.sh,
  # lane_windows.py): one window per kickoff, 90 to 20 minutes before, read every 30 minutes.
  # GitHub's cron does not fire reliably in this repo, so there is no schedule.
  push:
    branches: [main]
    paths:
      - "data/soccer_team_rules_window/**"
permissions:
  contents: write
concurrency:
  group: soccer-team-rules
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_soccer_team_rules.py && python3 test_soccer_team_rules_production.py && python3 test_save_records.py
      - name: Enter due matches and settle
        # Fetches the ESPN fixtures (data/streaks_raw.json, not committed) for the labels.
        run: python3 soccer_team_rules.py
      - name: Team rules Production feed (T1; 2026-10-24)
        # Right after the read above, so an entry 90-20 minutes before kickoff is published
        # while there is time to act on it (production.FIRST_PUBLISH_MIN).
        run: python3 soccer_team_rules_production.py
      - name: Save records
        # The Feeds heartbeat restamps data/soccer_team_rules_production_leads.json too, so it can push between
        # this run's checkout and its push. save_records.py rebases the ledger (only this workflow writes it)
        # and, on a rejected push, REBUILDS the feed from the merged ledger instead of failing on it.
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "Soccer team scoring rules paper observations" \
            --add data/soccer_team_rules_ledger.json \
            --derived data/soccer_team_rules_production_leads.json "python3 soccer_team_rules_production.py"
