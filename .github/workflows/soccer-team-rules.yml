name: Soccer team scoring rules paper research
on:
  workflow_dispatch:
  # The VPS asks for each read by pushing a stamp (scripts/vps_window_requests.sh,
  # lane_windows.py): one window per kickoff, 90 to 20 minutes before, read every 30 minutes.
  # GitHub's cron does not fire reliably in this repo, so there is no schedule.
  push:
    branches: [main]
    paths:
      - "data/soccer_team_rules_window/**"
permissions:
  contents: write
concurrency:
  group: soccer-team-rules
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_soccer_team_rules.py
      - name: Enter due matches and settle
        # Fetches the ESPN fixtures (data/streaks_raw.json, not committed) for the labels.
        run: python3 soccer_team_rules.py
      - name: Save records
        run: |
          set -euo pipefail
          python3 -c 'import json; json.load(open("data/soccer_team_rules_ledger.json"))'
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add data/soccer_team_rules_ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Soccer team scoring rules paper observations"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
