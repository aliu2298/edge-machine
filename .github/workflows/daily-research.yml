name: Econ and Finance Daily paper research
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  # The VPS asks for a read from inside each supported close's 2-3.5h window by pushing one
  # line here (scripts/vps_window_requests.sh, lane_windows.py). GitHub's cron cannot hold
  # a 90-minute window; the hourly schedule above stays as a backstop.
  push:
    branches: [main]
    paths:
      - "data/daily_window/**"
permissions:
  contents: write
concurrency:
  group: daily-research
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: |
          python3 test_daily_research.py
          python3 test_finance_nc.py
          python3 test_mentions_split.py
          python3 test_gas_daily_retired.py
          python3 test_gas_week_hold.py
      - name: Public market observations and paper settlement
        id: collect
        run: python3 daily_track.py
      # finance_spx_nc_no (2026-10-20): the S&P near-certain NO paper lane, its own ledger,
      # read in the same 16:00 ET window. A failure here fails the job visibly; the steps below
      # still run (their own `if`), so the other records are saved either way.
      - name: S&P near-certain NO paper lane
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        run: python3 finance_nc.py
      # Cheap side + resting take-profit on the commodity ladders (2026-10-27): wti_cheap_yes and
      # gas_cheap_no, the culture split engine (mentions_split.py), their own ledgers. Entries are
      # replayed from minute candles, so the hourly read needs no window stamp.
      - name: Commodity cheap-side paper lanes (WTI cheap YES, gas cheap NO daily and weekly)
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        run: python3 mentions_split.py commodities
      - name: Publish Econ Daily Production feed
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        run: python3 daily_production.py
      - name: Save records even when a source failed
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "Daily paper research observations" \
            --add data/daily_ledger.json \
            --optional data/finance_nc_ledger.json data/wti_cheap_yes_ledger.json data/gas_cheap_no_ledger.json data/gas_week_cheap_no_ledger.json \
            --derived data/econ_production_leads.json "python3 daily_production.py"
