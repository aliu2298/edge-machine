name: NFL team totals paper research
on:
  schedule:
    # Hourly, to settle entries and refresh the kickoff schedule. Entries need a read 75-45 minutes
    # before each NFL kickoff, which GitHub's cron cannot hold, so the VPS asks for those (below).
    - cron: '41 * * * *'
  workflow_dispatch:
  # The VPS asks for each read by pushing a stamp (scripts/vps_window_requests.sh,
  # lane_windows.nfl_windows): one window per ESPN kickoff, 75 to 45 minutes before.
  push:
    branches: [main]
    paths:
      - "data/nfl_tt_window/**"
permissions:
  contents: write
concurrency:
  group: nfl-tt
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_nfl_tt.py
      - name: Enter due games and settle (nfl_tt_over_3545, nfl_tt_over_main, own ledger)
        run: python3 nfl_tt.py
      - name: Save records
        run: |
          set -euo pipefail
          python3 -c 'import json; json.load(open("data/nfl_tt_ledger.json"))'
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add data/nfl_tt_ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NFL team totals paper observations"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
