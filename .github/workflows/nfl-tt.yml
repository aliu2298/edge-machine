name: NFL team totals paper research
on:
  schedule:
    # Hourly, to settle entries and refresh the kickoff schedule. Entries need a read 75-45 minutes
    # before each NFL kickoff, which GitHub's cron cannot hold, so the VPS asks for those (below).
    - cron: '41 * * * *'
  workflow_dispatch:
  # The VPS asks for each read by pushing a stamp (scripts/vps_window_requests.sh,
  # lane_windows.nfl_windows): one window per ESPN kickoff, 75 to 45 minutes before.
  push:
    branches: [main]
    paths:
      - "data/nfl_tt_window/**"
permissions:
  contents: write
concurrency:
  group: nfl-tt
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: |
          set -euo pipefail
          python3 test_nfl_tt.py
          python3 test_nfl_tt_main1.py
      - name: Enter due games and settle (nfl_tt_over_3545, nfl_tt_over_main, own ledger)
        run: python3 nfl_tt.py
      # nfl_tt_main1 (2026-11-08): the same windows, its own ledger, after the lanes above. An ESPN or Kalshi
      # outage is written into its ledger's error, not raised, so it never stops the lanes above from saving.
      - name: Enter due games and settle (nfl_tt_main1, own ledger)
        run: python3 nfl_tt_main1.py
      - name: Save records
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "NFL team totals paper observations" \
            --add data/nfl_tt_ledger.json --add data/nfl_tt_main1_ledger.json
