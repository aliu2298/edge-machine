name: Sandbox Tracker

# Logs what every connected prediction source says about six sports, settles the old
# calls against real market resolutions, and republishes public_site/sandbox.html.
#
# Runs on GitHub's servers on purpose. The whole method depends on a prediction being
# stamped BEFORE the contest starts, so it cannot depend on a laptop being awake.

on:
  schedule:
    # Every 3h since 2026-09-13, at :11 on 02, 05, ... UTC — ninety minutes clear of the
    # boards (41 */3). The offset is not cosmetic: the two workflows share a concurrency
    # group (see below). Six-hourly slots started up to 4.5h late, which priced tips hours
    # before kickoff and missed any tip published between runs for an early start.
    # sandbox_sources.ODDS_RUNS_PER_DAY must match this cadence, or credit pacing overspends.
    - cron: "11 2-23/3 * * *"
    # A NINTH run, 2026-10-05, for crypto_fav_band and nothing else. That lane reads the
    # Kalshi coin ladders 2-3.5h before their 21:05Z close, and the three-hourly cadence
    # straddles the window without ever landing in it: 17:11 is 3.90h out (too early) and
    # 20:11 is 0.90h (too late), so the lane could not have fired once. 18:11 is 2.90h out.
    #
    # It is 30 minutes from the boards at 18:41 rather than the usual ninety. That is
    # acceptable and not an oversight: the shared group is cancel-in-progress: false, so an
    # overlap QUEUES rather than cancelling, and a 90-minute clearance is impossible inside
    # a 90-minute window that already contains a boards run. The cost is a possible short
    # queue for the 18:41 boards refresh; the alternative was a lane that never fires.
    - cron: "11 18 * * *"
  workflow_dispatch:
  # The VPS asks for a run from inside that window by committing one line here, because
  # GitHub's cron cannot hold a 90-minute slot: over 18 days this workflow ran 4.2 times a
  # day against 8 scheduled and landed inside the window on 10 of 18. That box pushes with
  # an SSH deploy key and holds no API token, and a push from a deploy key is a real event
  # that starts a workflow, where a dispatch made with the repository's own GITHUB_TOKEN
  # would not. Scoped to this one path, so the 15-minute closing-price pushes to
  # data/sandbox_closes/ never trigger a tracker run.
  push:
    branches: [main]
    paths:
      - "data/crypto_window/**"

permissions:
  contents: write
  pages: write
  id-token: write

# Deliberately the SAME group as refresh-boards.yml. Concurrency groups are matched by
# name across the whole repository, so this makes the two workflows mutually exclusive
# without editing the existing one. They both publish the same public_site directory to
# the same Pages site, and two overlapping deployments would race to decide whose
# checkout wins. Queue, never cancel: GitHub's own guidance is that an in-progress
# production deployment must be allowed to finish.
concurrency:
  group: refresh-boards
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The ONLY dependency in this pipeline, and only this workflow has it. Oddspedia
      # sits behind Cloudflare, which 403s every plain request from any user-agent and
      # from the runner as readily as from a laptop — it wants a real browser engine.
      # Chromium's --dump-dom was tried first and is not usable: on a live page
      # it never reaches the idle state that ends the dump, so it simply hangs.
      #
      # Everything else stays stdlib. sandbox_browser.py degrades to "this source
      # reported nothing" when Playwright is missing, so a failure in this step costs
      # one column and never the run.
      - name: Install headless browser
        run: |
          # A missing browser costs one column and must not fail the run.
          if ! python3 -m pip install --quiet playwright || ! python3 -m playwright install --with-deps chromium; then
            echo "::warning::headless browser install failed — browser column degraded"
          fi

      # Fixture checks only, BEFORE anything is fetched or written. Every assertion
      # in here covers a failure that is invisible on the finished page: a flipped
      # probability, a price booked against the wrong game of a baseball series, a
      # prop market mistaken for a moneyline. Strict on purpose — this one fails
      # the run, and it does not read the live ledger. Live ledger, archive, stage,
      # feed, and close checks are the step after the commit. A DegenerateCluster
      # on the ledger (2026-09-28, test_sandbox.py:3890) failed here and skipped
      # grading for five runs. That check is not in this step anymore.
      - name: Logic tests
        run: SANDBOX_TEST_GROUP=fixture python3 test_sandbox.py

      # Fetch every source, log new pre-match quotes, settle whatever has resolved.
      # A source going dark is an empty column inside the script (collect catches it)
      # and grading still runs. A crash, or a production feed that cannot be rebuilt,
      # exits non-zero. The exit code is recorded and the step itself stays green:
      # failing here would skip the commit, and the pre-match quotes cannot be
      # recreated. The job still goes red in the final step.
      #
      # ODDS_API_KEY reads Pinnacle's lines through The Odds API. It is a repository
      # secret: GitHub masks it in logs, never passes it to workflows triggered from a
      # fork, and the adapter never prints the URL it travels in. Without it the Pinnacle
      # column reports itself down and every other source runs as before.
      - name: Collect predictions and settle results
        id: track
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set +e
          python3 sandbox_track.py
          echo "track_rc=$?" >> "$GITHUB_OUTPUT"

      - name: Build the tracker page
        id: build
        run: |
          set +e
          python3 sandbox_build.py
          echo "build_rc=$?" >> "$GITHUB_OUTPUT"

      # pipeline_gate.decide is what the tests exercise. A valid ledger is committed
      # even when the feed or the page build failed. public_site is committed, and
      # Pages is deployed, only when both steps exited 0. A missing or invalid
      # ledger is not committed at all.
      - name: Decide what a failed run may publish
        id: gate
        env:
          TRACK_RC: ${{ steps.track.outputs.track_rc }}
          BUILD_RC: ${{ steps.build.outputs.build_rc }}
        run: |
          set -euo pipefail
          LEDGER_OK=0
          if python3 -c 'import json; json.load(open("data/sandbox_ledger.json"))'; then
            LEDGER_OK=1
          fi
          export LEDGER_OK
          python3 - << 'PY'
          import os
          from pipeline_gate import decide
          commit_data, commit_site, deploy, fail = decide(
              os.environ.get("TRACK_RC", ""),
              os.environ.get("BUILD_RC", ""),
              os.environ.get("LEDGER_OK") == "1",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("commit_data=%s\n" % ("true" if commit_data else "false"))
              fh.write("commit_site=%s\n" % ("true" if commit_site else "false"))
              fh.write("deploy=%s\n" % ("true" if deploy else "false"))
              fh.write("fail=%s\n" % ("true" if fail else "false"))
          PY

      - name: Commit and push if changed
        if: steps.gate.outputs.commit_data == 'true'
        env:
          COMMIT_SITE: ${{ steps.gate.outputs.commit_site }}
        run: |
          set -euo pipefail
          # Guard the gate. Atomic writes should keep this file valid; a missing
          # or truncated ledger is still not committed.
          python3 -c 'import json; json.load(open("data/sandbox_ledger.json"))'
          git config user.name  "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"

          # The same explicit paths as before. A failed feed or page build
          # commits the data files only — not public_site, which may be half
          # written or still describing the previous feed.
          DATA="data/sandbox_ledger.json data/stages.json data/sandbox_archive data/production_leads.json data/espn_history"
          SITE="public_site/sandbox.html public_site/production.html public_site/index.html"
          if [ "$COMMIT_SITE" = "true" ]; then
            git add $DATA $SITE
            # trading.html is rebuilt with the other pages. site.css and the
            # first-party scripts are static and already in the tree. Skip the
            # add when the page is absent so an empty diff still exits 0.
            if [ -f public_site/trading.html ]; then
              git add public_site/trading.html
            fi
            # soccer.html, tennis.html and cricket.html are rebuilt with the
            # other pages. Skip each add when the page is absent so an empty
            # diff still exits 0.
            if [ -f public_site/soccer.html ]; then
              git add public_site/soccer.html
            fi
            if [ -f public_site/tennis.html ]; then
              git add public_site/tennis.html
            fi
            if [ -f public_site/cricket.html ]; then
              git add public_site/cricket.html
            fi
            # Weekly archive pages are rebuilt with the Sandbox. Skip the add
            # when the directory is absent so an empty diff still exits 0.
            if [ -d public_site/archive ]; then
              git add public_site/archive
            fi
          else
            # A failed build leaves public_site modified but unstaged. git pull
            # --rebase refuses to start with that dirt, the close job has usually
            # moved main, and all three push retries then die. The ledger this
            # gate exists to save never lands. Put the pages back before add.
            git checkout -- public_site/
            git add $DATA
          fi
          if git diff --cached --quiet; then
            echo "no changes — nothing to commit"
            exit 0
          fi
          git commit -m "Sandbox tracker ($(date -u +%Y-%m-%d\ %H:%MZ))"
          # Commit ONCE, then retry only the push. The loop used to re-run `git add` after a
          # rebase, find nothing new staged (the commit already held it), print "no changes"
          # and stop — so a run that lost the push race to the closing-price job reported
          # success and its ledger update never reached main (2026-09-13 21:26).
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "published on attempt $attempt"
              exit 0
            fi

            # A rejection here means refresh-boards published while this run was working.
            # Rebase, do NOT reset: unlike the boards, this ledger is not derivable from
            # anything — it is the only record of what each source said and when, and a
            # reset would silently throw away calls that have already been graded. The
            # rebase is safe because refresh-boards does not write the ledger or these
            # pages. index.html is written in this build, beside production.html, and
            # refresh-boards does not stage it. Takeover may republish the shell by
            # copying this page's tiles; it does not count them again. Nothing else
            # touches sandbox.html, production.html, sandbox_ledger.json, stages.json or sandbox_archive/.
            echo "push rejected — rebasing onto the newer main (attempt $attempt)"
            # -X theirs: on a conflict, keep THIS run's copy (during a rebase "theirs" is the
            # commit being replayed). The pages are regenerated from this run's ledger, and a
            # hand-built copy pushed from a laptop mid-run made the rebase stop and the run lose
            # its promotions (2026-09-16 22:08).
            # --autostash: anything still dirty outside the data list (public_site is already
            # restored above) must not make this rebase refuse.
            git pull --rebase --autostash -X theirs origin main
          done
          echo "::error::could not push the ledger after 3 attempts"
          exit 1

      # Publishes the whole site, so it carries the boards along with it. Safe because
      # the shared concurrency group means refresh-boards cannot be mid-flight, and the
      # rebase above leaves this checkout at origin/main. Skipped when the feed or the
      # page build failed: the ledger commit above already kept the quotes.
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public_site
      - id: deployment
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # After the ledger commit and the Pages deploy. A failure here turns the
      # run red and is named again by the alert step below. It does not use
      # always(): a fixture-test failure, a cancelled run, or a failed push
      # skips it. The commit step has already finished by the time this runs.
      - name: Live ledger checks
        id: live
        run: |
          set +e
          SANDBOX_TEST_GROUP=live python3 test_sandbox.py
          rc=$?
          echo "live_rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # The track and build steps stay green so the ledger can be committed. This
      # step is what makes the job red, and what sends the mail. It also reports
      # a live-ledger check that failed after that commit.
      - name: Fail the job if the tracker or the page build failed
        if: always()
        env:
          TRACK_RC: ${{ steps.track.outputs.track_rc }}
          BUILD_RC: ${{ steps.build.outputs.build_rc }}
          GATE_FAIL: ${{ steps.gate.outputs.fail }}
          LIVE_RC: ${{ steps.live.outputs.live_rc }}
        run: |
          set -euo pipefail
          code=0
          # Skipped when setup, the logic tests, or a cancel stopped the run.
          # An empty code used to exit 0, so the job looked green.
          if [ -z "${TRACK_RC}" ] || [ -z "${BUILD_RC}" ]; then
            echo "::error::tracker step did not run"
            code=1
          fi
          if [ -n "${TRACK_RC}" ] && [ "$TRACK_RC" != "0" ]; then
            echo "::error::Collect predictions and settle results failed (sandbox_track.py exit ${TRACK_RC})"
            code=1
          fi
          if [ -n "${BUILD_RC}" ] && [ "$BUILD_RC" != "0" ]; then
            echo "::error::Build the tracker page failed (sandbox_build.py exit ${BUILD_RC})"
            code=1
          fi
          # Reported even when a step already failed: a bad ledger is its own fault.
          if [ "${GATE_FAIL}" = "true" ]; then
            echo "::error::data/sandbox_ledger.json is missing or not valid JSON"
            code=1
          fi
          # Empty when the live step was skipped. A real failure is its own red,
          # and it cannot be what skipped the commit: that step is already done.
          if [ -n "${LIVE_RC-}" ] && [ "$LIVE_RC" != "0" ]; then
            echo "::error::Live ledger checks failed (test_sandbox.py exit ${LIVE_RC})"
            code=1
          fi
          exit "$code"
