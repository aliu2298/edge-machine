name: Nations League dump bid
# nl_dump.py (2026-11-13): replays each settled UEFA Nations League total-goals market once, from Kalshi's public trade prints, under the
# fixed trailing-bid rule of docs/prereg_nl_dump_2026-11-13.md. A Sandbox PAPER watch. No orders, no VPS, no live loop. A late run only delays a row.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nl-dump
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_nl_dump.py
      - name: Replay the settled games
        run: python3 nl_dump.py
      - name: Save records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "Nations League dump bid paper watch" \
            --add data/nl_dump_ledger.json \
            --regenerate "python3 nl_dump.py" \
            --after "gh workflow run sandbox-tracker.yml --ref main"
