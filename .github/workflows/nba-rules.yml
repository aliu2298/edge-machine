name: NBA label rules paper research
on:
  schedule:
    # Every 15 minutes: a rule enters 20-90 minutes before tip-off, and settles on Kalshi's result.
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-rules
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_nba_rules.py
      - name: Enter due games and settle
        run: python3 nba_rules.py
      - name: Save records
        run: |
          set -euo pipefail
          python3 -c 'import json; json.load(open("data/nba_rules_ledger.json"))'
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add data/nba_rules_ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NBA label rules paper observations"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
