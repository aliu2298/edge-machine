name: NBA label rules paper research
on:
  schedule:
    # Every 15 minutes: a rule enters 20-90 minutes before tip-off, and settles on Kalshi's result.
    - cron: '*/15 * * * *'
  workflow_dispatch:
  # The VPS asks for each read by pushing a stamp (scripts/vps_window_requests.sh,
  # lane_windows.py): GitHub's cron alone never fired this workflow (2026-10-17).
  push:
    branches: [main]
    paths:
      - "data/nba_window/**"
permissions:
  contents: write
concurrency:
  group: nba-rules
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_nba_rules.py
      - name: Enter due games and settle
        run: python3 nba_rules.py
      - name: Save records
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "NBA label rules paper observations" \
            --add data/nba_rules_ledger.json
