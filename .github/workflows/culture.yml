name: Culture lanes paper research
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  # The VPS asks for each read by pushing a stamp (scripts/vps_window_requests.sh,
  # lane_windows.py): GitHub's cron alone never fired this workflow (2026-10-17).
  push:
    branches: [main]
    paths:
      - "data/culture_window/**"
permissions:
  contents: write
concurrency:
  group: culture-research
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_culture.py
      - name: Culture markets, Rotten Tomatoes snapshots and paper settlement
        run: python3 culture_track.py
      - name: Save records
        run: |
          set -euo pipefail
          python3 -c 'import json; json.load(open("data/culture_ledger.json")); json.load(open("data/rt_snapshots.json"))'
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add data/culture_ledger.json data/rt_snapshots.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Culture paper research observations"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            # Only this workflow owns these two files.
            git rebase origin/main
          done
          exit 1
