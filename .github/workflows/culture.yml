name: Culture lanes paper research
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  # The VPS asks for each read by pushing a stamp (scripts/vps_window_requests.sh,
  # lane_windows.py): GitHub's cron alone never fired this workflow (2026-10-17).
  push:
    branches: [main]
    paths:
      - "data/culture_window/**"
permissions:
  contents: write
concurrency:
  group: culture-research
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: |
          python3 test_culture.py
          python3 test_mentions_split.py
          python3 test_mentions_dip_hold.py
      - name: Culture markets, paper settlement and Rotten Tomatoes snapshots (rt_model revived 2026-10-26)
        run: python3 culture_track.py
      - name: Trump mentions feed (mentions_rate; Production 2026-10-20 to 2026-10-26, now graded leads only)
        run: python3 culture_production.py
      - name: Cheap-side lanes, all retired (mentions 2026-10-31, album sales 2026-11-11) - open entries still fill and settle
        run: python3 mentions_split.py
      - name: Trump mentions 10c dip bid, held to settlement (Sandbox paper, 2026-11-01)
        run: python3 mentions_dip_hold.py
      - name: Save records
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "Culture paper research observations" \
            --add data/culture_ledger.json data/rt_snapshots.json data/culture_production_leads.json data/mentions_split_ledger.json data/mentions_split_wide_ledger.json data/mentions_month_split_ledger.json data/mentions_month_split_wide_ledger.json data/album_cheap_rungs_ledger.json data/album_cheap_no_ledger.json data/mentions_dip_hold_ledger.json
