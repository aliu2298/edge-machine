name: Finance discovery

# Manual only. Reads Kalshi's public API (no key, no orders) and prints which daily
# finance ladders would pass the favourite-band liquidity floor. Writes nothing to the
# repo: the report is the job log and the step summary.

on:
  workflow_dispatch:
  # Registered from this branch (a dispatch-only workflow off main is not), so the
  # discovery runs on the push that carries it. Dropped before the lane PR.
  push:
    branches: [claude/funny-maxwell-1gel23]
    paths:
      - finance_discover.py
      - .github/workflows/finance-discover.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Read the Kalshi finance ladders
        run: python3 finance_discover.py --days 6 --json
