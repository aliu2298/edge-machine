name: NBA value lanes and ladder tracker
on:
  schedule:
    # Hourly: refresh ESPN's games, track every finished game's Kalshi ladders (backfills on the
    # first run), settle, and rewrite the tip schedule the VPS reads. Entries need a read 90-60
    # minutes and 26-18 hours before each tip, which GitHub's cron cannot hold, so the VPS asks.
    - cron: '23 * * * *'
  workflow_dispatch:
  # The VPS asks for each read by pushing a stamp (scripts/vps_window_requests.sh,
  # lane_windows.nba_value_windows): two windows per ESPN tip.
  push:
    branches: [main]
    paths:
      - "data/nba_value_window/**"
permissions:
  contents: write
concurrency:
  group: nba-value
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_nba_value.py && python3 test_nba_value_production.py
      - name: Track, enter due games and settle (nba_tt_value_*, nba_1q_value_*, own ledgers)
        run: python3 nba_value.py
      # data/nba_value_production_leads.json is written by the Feeds heartbeat only (it runs after this workflow): the
      # lanes left Production on 2026-10-28, so the feed carries no pair and a second writer here only raced it.
      - name: Save records
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "NBA value lanes and ladder tracker observations" \
            --add data/nba_value_ledger.json data/nba_ladder_track.json
