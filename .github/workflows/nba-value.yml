name: NBA value lanes and ladder tracker
on:
  schedule:
    # Hourly: refresh ESPN's games, track every finished game's Kalshi ladders (backfills on the
    # first run), settle, and rewrite the tip schedule the VPS reads. Entries need a read 90-60
    # minutes and 26-18 hours before each tip, which GitHub's cron cannot hold, so the VPS asks.
    - cron: '23 * * * *'
  workflow_dispatch:
  # The VPS asks for each read by pushing a stamp (scripts/vps_window_requests.sh,
  # lane_windows.nba_value_windows): two windows per ESPN tip.
  push:
    branches: [main]
    paths:
      - "data/nba_value_window/**"
permissions:
  contents: write
concurrency:
  group: nba-value
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_nba_value.py
      - name: Track, enter due games and settle (nba_tt_value_*, nba_1q_value_*, own ledgers)
        run: python3 nba_value.py
      - name: Save records
        run: |
          set -euo pipefail
          python3 -c 'import json; json.load(open("data/nba_value_ledger.json")); json.load(open("data/nba_ladder_track.json"))'
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add data/nba_value_ledger.json data/nba_ladder_track.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NBA value lanes and ladder tracker observations"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
