name: Over 3.5 cheap NO paper research
on:
  schedule:
    # Hourly. Every settled game is evaluated once, after the fact, from its trades, so no window stamp is
    # needed and a missed run only delays a row.
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: o35-cheap-no
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_o35_cheap_no.py
      - name: Over 3.5 cheap NO lane (Sandbox paper since 2026-10-28, trade-print fills)
        run: python3 o35_cheap_no.py
      - name: Save records
        run: |
          set -euo pipefail
          python3 -c 'import json; json.load(open("data/o35_cheap_no_ledger.json"))'
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          git add data/o35_cheap_no_ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Over 3.5 cheap NO paper observations"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              # a push by the workflow token does not start the page build: ask for it so the page carries this ledger
              GH_TOKEN=${{ github.token }} gh workflow run sandbox-tracker.yml --ref main || true
              exit 0
            fi
            git fetch origin main
            # Only this workflow owns this file.
            git rebase origin/main
          done
          exit 1
