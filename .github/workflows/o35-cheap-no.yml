name: Over 3.5 cheap NO paper research
on:
  schedule:
    # Hourly. Every settled game is evaluated once, after the fact, from its trades, so no window stamp is
    # needed and a missed run only delays a row.
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: o35-cheap-no
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_o35_cheap_no.py && python3 test_o35_production.py
      - name: Over 3.5 cheap NO lane (Sandbox paper, v2 since 2026-10-31, trade-print fills)
        run: python3 o35_cheap_no.py
      - name: Production feed for the follower's resting-bid executor (a live Kalshi read, not the ledger)
        run: python3 o35_production.py
      - name: Save records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "Over 3.5 cheap NO paper observations" \
            --add data/o35_cheap_no_ledger.json \
            --derived data/production_o35_leads.json "python3 o35_production.py" \
            --after "gh workflow run sandbox-tracker.yml --ref main"
