name: NHL goal lanes paper research
on:
  schedule:
    # Backup only: GitHub's hourly cron fired this twice in a day (2026-11-08). The VPS asks for the hourly read by pushing a
    # stamp (scripts/vps_window_requests.sh, lane_windows.py). Every settled NHL game is read once, after the final horn, from
    # its 1-minute candles, its puck-line and totals markets and their trade prints, so a late run only delays a row.
    - cron: '47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/nhl_goal_window/**"
permissions:
  contents: write
  actions: write
concurrency:
  group: nhl-goal
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_nhl_goal_lanes.py
      - name: NHL puck line NO and over YES after a goal (Sandbox paper since 2026-11-08)
        run: python3 nhl_goal_lanes.py
      - name: Save records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "NHL goal lanes paper observations" \
            --add data/nhl_goal_lanes_ledger.json \
            --after "gh workflow run sandbox-tracker.yml --ref main"
