name: PR tests

# Logic tests plus an offline Sandbox audit, on every pull request into main.
# Read-only: contents: read, no secrets, no push, no artifact upload, no Pages
# deploy. The scheduled audit on main is a different workflow and still
# contacts the venues.
#
# Browser checks import playwright.sync_api and launch channel="chrome"
# (test_site_layout.py, test_sticky_header.py, and the same skip in any
# later test such as test_phone_header.py). REQUIRE_BROWSER=1 makes that
# skip a failure. Without the flag, a local run still warns and continues.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REQUIRE_BROWSER: "1"
  # Current release of the package the tests import. They do not pin one.
  PLAYWRIGHT_VERSION: "1.63.0"

# A new push to the same PR replaces the run already in progress.
concurrency:
  group: pr-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ env.PLAYWRIGHT_VERSION }}

      # channel="chrome" uses the Google Chrome already on the runner.
      # Chromium here is the Playwright browser build plus its system libraries.
      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "playwright==${PLAYWRIGHT_VERSION}"
          python -m playwright install --with-deps chromium
          python -m playwright --version
          google-chrome --version

      - name: Run every root test
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(test_*.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "no test_*.py files in the repo root"
            exit 1
          fi
          for f in "${tests[@]}"; do
            echo "=== $f ==="
            log="$(mktemp)"
            python3 "$f" | tee "$log"
            # A test that still warns and returns 0 (the phone-header copy on
            # #55, until it reads REQUIRE_BROWSER) must not leave CI green.
            if grep -F "Playwright is not installed; browser checks" "$log"; then
              echo "::error::$f skipped its browser checks"
              exit 1
            fi
            rm -f "$log"
          done

      # Node is preinstalled on the GitHub-hosted runner. No setup action:
      # this step only runs the same-origin table sort test.
      - name: Table sort and filter
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v node >/dev/null 2>&1; then
            echo "skipped: node is not installed on this runner"
            exit 0
          fi
          node test_tables.js

      # Venue spot-checks need the network. --no-network skips only those and
      # prints a skipped: line for each. It does not touch the scheduled audit.
      - name: Audit the Sandbox record offline
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox_audit.py --no-network
