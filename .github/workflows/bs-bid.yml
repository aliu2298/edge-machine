name: Before-start bid (fights, NFL)
# bs_bid.py (2026-11-14): replays each settled fights and NFL winner market once, from Kalshi's public trade prints, under the fixed before-start
# bid of docs/prereg_bs_bid_2026-11-14.md. A Sandbox PAPER watch. No orders, no VPS, no live loop. The replay is after the fact, so a late or
# missed run only delays rows: the next run reads every settled market that is not yet in the ledger.
on:
  schedule:
    - cron: '29 * * * *'
    - cron: '54 4,10,16,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: bs-bid
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_bs_bid.py
      - name: Replay the settled games
        run: python3 bs_bid.py
      - name: Save records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "Before-start bid (fights, NFL) paper watch" \
            --add data/bs_bid_ledger.json \
            --regenerate "python3 bs_bid.py" \
            --after "gh workflow run sandbox-tracker.yml --ref main"
