name: NBA quarter lines (Sandbox paper)
on:
  schedule:
    # Every ten minutes through the NBA tip hours (15:00-04:59 UTC): the entry read is one a game, 15-40 minutes before its tip (the target is about 30),
    # taken by the first run inside that window. Finished games and settlements are picked up on the same runs.
    - cron: '3,13,23,33,43,53 15-23,0-4 * * *'
    - cron: '27 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nba-qlines
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Tests
        run: python3 test_nba_qlines.py
      - name: NBA quarter lines (paper only, no orders)
        run: python3 nba_qlines.py
      - name: Save records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "aliu2298"
          git config user.email "77032228+aliu2298@users.noreply.github.com"
          python3 save_records.py --message "NBA quarter lines paper observations" \
            --add data/nba_qlines_ledger.json data/nba_qlines/games.json \
            --after "gh workflow run sandbox-tracker.yml --ref main"
